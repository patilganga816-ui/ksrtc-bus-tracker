<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRTC — Local Bus Tracking System | Unified Portal</title>
    <!-- Favicon & Stylesheet -->
    <link rel="stylesheet" href="/css/ksrtc-theme.css">
    <!-- Supabase JS Client via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Header / Branding -->
    <header class="ksrtc-header">
        <a href="/index.html" class="ksrtc-brand">
            <div class="ksrtc-logo-icon">K</div>
            <div class="ksrtc-title-block">
                <h1 data-i18n="appName">KSRTC LOCAL BUS TRACKING</h1>
                <span data-i18n="unifiedPortal">Hubballi–Dharwad Transit Division</span>
            </div>
        </a>
        <div class="ksrtc-lang-container"></div>
    </header>

    <!-- Main Common Login Interface -->
    <main class="auth-wrapper">
        <div class="auth-card">
            
            <div class="auth-header">
                <div class="logo-badge">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor">
                        <path d="M4 16c0 .88.39 1.67 1 2.22V20c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h8v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1.78c.61-.55 1-1.34 1-2.22V6c0-3.5-3.58-4-8-4s-8 .5-8 4v10zm3.5 1c-.83 0-1.5-.67-1.5-1.5S6.67 14 7.5 14s1.5.67 1.5 1.5S8.33 17 7.5 17zm9 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm1.5-6H6V6h12v5z"/>
                    </svg>
                </div>
                <h2>Unified Transit Login</h2>
                <p id="role-welcome-text">Select your role to access your dashboard</p>
            </div>

            <!-- Role Segmented Selector: Passenger | Driver | Administrator -->
            <div class="role-segmented-control" role="tablist">
                <button type="button" class="role-pill-btn active" id="pill-passenger" onclick="selectRole('passenger')">
                    <span>👤</span> Passenger
                </button>
                <button type="button" class="role-pill-btn" id="pill-driver" onclick="selectRole('driver')">
                    <span>🚍</span> Driver
                </button>
                <button type="button" class="role-pill-btn" id="pill-admin" onclick="selectRole('admin')">
                    <span>🛡️</span> Admin
                </button>
            </div>

            <!-- Dynamic Alert Box -->
            <div id="alert-container" style="display: none;"></div>

            <!-- Common Login Form -->
            <form id="common-login-form" onsubmit="handleUnifiedLogin(event)">
                
                <!-- Email / Username Input -->
                <div class="form-group">
                    <label class="form-label" for="login-email" id="email-label">Email Address</label>
                    <div class="input-container">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="login-email" class="form-input" placeholder="e.g. commuter@ksrtc.in" required autocomplete="username">
                    </div>
                </div>

                <!-- Password Input with Show/Hide Toggle -->
                <div class="form-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
                        <a href="/reset-password.html" style="font-size: 0.8rem; color: var(--ksrtc-primary); text-decoration: none;">Forgot Password?</a>
                    </div>
                    <div class="input-container">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('login-password')">👁️</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-submit" class="btn-primary" style="margin-top: 10px;">
                    <span id="btn-text">Sign In as Passenger</span>
                </button>

            </form>

            <!-- Dynamic Footer: Passenger Registration or Admin Notice -->
            <div class="auth-footer" id="auth-footer-dynamic">
                Don't have a passenger account? <a href="/passenger/register.html">Register Here</a>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/i18n.js"></script>

    <script>
        let currentSelectedRole = 'passenger';

        window.addEventListener('ksrtc:languageChanged', () => {
            selectRole(currentSelectedRole);
        });

        // Check for URL parameters (e.g. session_expired, logged_out, role)
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get('logged_out')) {
                showAlert('You have been logged out successfully.', 'success');
            } else if (params.get('session_expired')) {
                showAlert('Your session has expired. Please sign in again.', 'error');
            } else if (params.get('registered')) {
                showAlert('Registration successful! Please sign in with your credentials.', 'success');
            }

            const requestedRole = params.get('role');
            if (requestedRole && ['passenger', 'driver', 'admin'].includes(requestedRole.toLowerCase())) {
                selectRole(requestedRole.toLowerCase());
            }
        });

        function selectRole(role) {
            currentSelectedRole = role;
            
            // Update active pill UI
            document.querySelectorAll('.role-pill-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`pill-${role}`).classList.add('active');

            const welcomeText = document.getElementById('role-welcome-text');
            const submitBtnText = document.getElementById('btn-text');
            const footerDynamic = document.getElementById('auth-footer-dynamic');
            const emailInput = document.getElementById('login-email');

            if (role === 'passenger') {
                welcomeText.textContent = i18n.getLanguage() === 'kn' ? 'ಸ್ವಾಗತ! ಹುಬ್ಬಳ್ಳಿ-ಧಾರವಾಡದ ನಗರ ಬಸ್‌ಗಳನ್ನು ಲೈವ್ ಟ್ರ್ಯಾಕ್ ಮಾಡಿ.' :
                    (i18n.getLanguage() === 'hi' ? 'स्वागत है! हुबली-धारवाड़ में लाइव सिटी बसों को ट्रैक करें।' : 'Welcome, Commuter! Track live buses across Hubballi–Dharwad.');
                submitBtnText.textContent = i18n.t('btnSignInAs', { role: i18n.t('rolePassenger') });
                emailInput.placeholder = 'e.g. passenger@gmail.com';
                footerDynamic.innerHTML = `${i18n.t('noAccountNotice')} <a href="/passenger/register.html">${i18n.t('registerHere')}</a>`;
            } else if (role === 'driver') {
                welcomeText.textContent = i18n.getLanguage() === 'kn' ? 'ಚಾಲಕರ ಪೋರ್ಟಲ್ — ನಿಯೋಜಿತ ಬಸ್ ಮತ್ತು ಲೈವ್ ಜಿಪಿಎಸ್ ಹಂಚಿಕೊಳ್ಳಿ.' :
                    (i18n.getLanguage() === 'hi' ? 'ड्राइवर पोर्टल — आवंटित बस तक पहुँचें और लाइव जीपीएस स्ट्रीम करें।' : 'KSRTC Driver Portal — Access assigned bus and stream live GPS coordinates.');
                submitBtnText.textContent = i18n.t('btnSignInAs', { role: i18n.t('roleDriver') });
                emailInput.placeholder = 'e.g. driver@ksrtc.in';
                footerDynamic.innerHTML = `Driver accounts are authorized by Depot Administration.`;
            } else if (role === 'admin') {
                welcomeText.textContent = i18n.getLanguage() === 'kn' ? 'ಡಿಪೋ ಆಡಳಿತಾಧಿಕಾರಿ — ಫ್ಲೀಟ್ ನಿರ್ವಹಣೆ ಮತ್ತು ಲೈವ್ ಮಾನಿಟರಿಂಗ್.' :
                    (i18n.getLanguage() === 'hi' ? 'डिपो व्यवस्थापक — बेड़ा प्रबंधन और लाइव निगरानी।' : 'Transit Depot Administrator — Fleet Management & Live Fleet Monitoring.');
                submitBtnText.textContent = i18n.t('btnSignInAs', { role: i18n.t('roleAdmin') });
                emailInput.placeholder = 'e.g. admin@ksrtc.in';
                footerDynamic.innerHTML = `Authorized Administrative Access Only.`;
            }

            hideAlert();
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
            } else {
                input.type = 'password';
            }
        }

        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alert-container');
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <div>${message}</div>`;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            const alertBox = document.getElementById('alert-container');
            alertBox.style.display = 'none';
        }

        async function handleUnifiedLogin(e) {
            e.preventDefault();
            hideAlert();

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const submitBtn = document.getElementById('btn-submit');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying credentials...</span>';

            try {
                const res = await auth.login(email, password, currentSelectedRole);

                if (!res.success) {
                    showAlert(res.message, 'error');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span id="btn-text">Sign In as ${currentSelectedRole.charAt(0).toUpperCase() + currentSelectedRole.slice(1)}</span>`;
                    return;
                }

                showAlert(`Login verified! Redirecting to ${currentSelectedRole} dashboard...`, 'success');
                setTimeout(() => {
                    window.location.href = res.redirectUrl;
                }, 600);

            } catch (err) {
                showAlert('Login communication failed. Please check network.', 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span id="btn-text">Sign In</span>`;
            }
        }
    </script>
</body>
</html>
