<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRTC — Passenger Registration</title>
    <link rel="stylesheet" href="/css/ksrtc-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="ksrtc-header">
        <a href="/index.html" class="ksrtc-brand">
            <div class="ksrtc-logo-icon">K</div>
            <div class="ksrtc-title-block">
                <h1 data-i18n="appName">KSRTC LOCAL BUS TRACKING</h1>
                <span data-i18n="unifiedPortal">Hubballi–Dharwad Transit Division</span>
            </div>
        </a>
        <div class="ksrtc-lang-container"></div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 480px;">
            
            <div class="auth-header">
                <div class="logo-badge" style="background: #e0f2fe; color: #0369a1;">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                        <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <h2>Create Passenger Account</h2>
                <p>Register to track live buses, save favourite routes, and receive transit updates</p>
            </div>

            <div id="alert-container" style="display: none;"></div>

            <form id="passenger-register-form" onsubmit="handleRegistration(event)">
                
                <!-- Full Name -->
                <div class="form-group">
                    <label class="form-label" for="reg-name">Full Name</label>
                    <div class="input-container">
                        <span class="input-icon">👤</span>
                        <input type="text" id="reg-name" class="form-input" placeholder="e.g. Ramesh Patil" required>
                    </div>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <div class="input-container">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="reg-email" class="form-input" placeholder="e.g. ramesh.patil@gmail.com" required>
                    </div>
                </div>

                <!-- Mobile Number (10 digits Indian) -->
                <div class="form-group">
                    <label class="form-label" for="reg-mobile">Mobile Number (India)</label>
                    <div class="input-container">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="reg-mobile" class="form-input" placeholder="e.g. 9876543210" pattern="[6-9][0-9]{9}" maxlength="10" required>
                    </div>
                    <small style="color: var(--text-muted); font-size: 0.75rem;">Enter 10-digit mobile number starting with 6, 7, 8, or 9.</small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <div class="input-container">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-password" class="form-input" placeholder="Minimum 6 characters" minlength="6" required>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label class="form-label" for="reg-confirm-password">Confirm Password</label>
                    <div class="input-container">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="reg-confirm-password" class="form-input" placeholder="Re-enter password" minlength="6" required>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btn-register" class="btn-primary" style="margin-top: 16px;">
                    <span id="btn-reg-text">Register Account</span>
                </button>

            </form>

            <div class="auth-footer">
                Already registered? <a href="/index.html">Back to Login</a>
            </div>

        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/i18n.js"></script>

    <script>
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alert-container');
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <div>${message}</div>`;
            alertBox.style.display = 'flex';
        }

        function hideAlert() {
            const alertBox = document.getElementById('alert-container');
            alertBox.style.display = 'none';
        }

        async function handleRegistration(e) {
            e.preventDefault();
            hideAlert();

            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const mobileNumber = document.getElementById('reg-mobile').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;

            // Form validations
            if (password !== confirmPassword) {
                showAlert('Passwords do not match. Please re-enter identical passwords.', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password must contain at least 6 characters.', 'error');
                return;
            }

            const mobileRegex = /^[6-9]\d{9}$/;
            if (!mobileRegex.test(mobileNumber)) {
                showAlert('Please provide a valid 10-digit Indian mobile number.', 'error');
                return;
            }

            const btn = document.getElementById('btn-register');
            btn.disabled = true;
            btn.innerHTML = '<span>Creating Account...</span>';

            try {
                const res = await api.post('/auth/register', {
                    full_name: fullName,
                    email: email,
                    mobile_number: mobileNumber,
                    password: password,
                    confirm_password: confirmPassword
                });

                if (!res.success) {
                    showAlert(res.message || 'Registration failed.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Register Account</span>';
                    return;
                }

                showAlert('Registration successful! Redirecting to login...', 'success');
                setTimeout(() => {
                    window.location.href = '/index.html?registered=1';
                }, 1200);

            } catch (err) {
                showAlert('Network error during registration.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<span>Register Account</span>';
            }
        }
    </script>
</body>
</html>
