<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSRTC — Reset Password</title>
    <link rel="stylesheet" href="/css/ksrtc-theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="ksrtc-header">
        <a href="/index.html" class="ksrtc-brand">
            <div class="ksrtc-logo-icon">K</div>
            <div class="ksrtc-title-block">
                <h1>KSRTC LOCAL BUS TRACKING</h1>
                <span>Hubballi–Dharwad Transit Division</span>
            </div>
        </a>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 440px;">
            <div class="auth-header">
                <div class="logo-badge" style="background: #fef3c7; color: #b45309;">
                    <svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor">
                        <path d="M12 17c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm6-9h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6z"/>
                    </svg>
                </div>
                <h2>Reset Password</h2>
                <p>Enter your registered email address to receive password reset instructions</p>
            </div>

            <div id="alert-container" style="display: none;"></div>

            <form id="reset-form" onsubmit="handleReset(event)">
                <div class="form-group">
                    <label class="form-label" for="reset-email">Registered Email</label>
                    <div class="input-container">
                        <span class="input-icon">✉️</span>
                        <input type="email" id="reset-email" class="form-input" placeholder="e.g. commuter@gmail.com" required>
                    </div>
                </div>

                <button type="submit" id="btn-reset" class="btn-primary" style="margin-top: 14px;">
                    Send Reset Link
                </button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="/index.html">Back to Login</a>
            </div>
        </div>
    </main>

    <script src="/js/config.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>

    <script>
        function showAlert(message, type = 'error') {
            const alertBox = document.getElementById('alert-container');
            alertBox.className = `alert-box alert-${type}`;
            alertBox.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span> <div>${message}</div>`;
            alertBox.style.display = 'flex';
        }

        async function handleReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-email').value.trim();
            const btn = document.getElementById('btn-reset');

            btn.disabled = true;
            btn.textContent = 'Processing request...';

            try {
                const client = window.getSupabaseClient ? window.getSupabaseClient() : null;
                if (client) {
                    const { error } = await client.auth.resetPasswordForEmail(email, {
                        redirectTo: window.location.origin + '/reset-password.html'
                    });
                    if (error) throw error;
                }
                showAlert('Password reset instructions sent. Please check your email inbox.', 'success');
            } catch (err) {
                showAlert(err.message || 'Failed to request password reset. Please try again.', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
